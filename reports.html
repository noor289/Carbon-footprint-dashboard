<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Carbon Footprint Dashboard</title>
  <meta name="description" content="Detailed emissions reports and monthly history for your carbon footprint tracking.">

  <link rel="canonical" href="https://noor289.github.io/Carbon-footprint-dashboard/reports.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Reports | Carbon Footprint Dashboard">
  <meta property="og:description" content="Detailed emissions reports and monthly history for your carbon footprint tracking.">
  <meta property="og:url" content="https://noor289.github.io/Carbon-footprint-dashboard/reports.html">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Reports | Carbon Footprint Dashboard">
  <meta name="twitter:description" content="Detailed emissions reports and monthly history for your carbon footprint tracking.">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tailwind.css">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-background text-text font-sans">

  <div class="flex min-h-screen">

    <aside id="sidebar"
      class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-primary text-white flex flex-col p-6
             transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
      <div class="flex items-center justify-between mb-10">
        <span class="text-2xl font-bold">🌱 EcoTrack</span>
        <button id="sidebarClose" class="lg:hidden text-white/80 hover:text-white" aria-label="Close sidebar">
          ✕
        </button>
      </div>
      <nav class="flex flex-col gap-2 text-sm">
        <a href="index.html" class="px-3 py-2 rounded-lg hover:bg-white/10 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2">Dashboard</a>
        <a href="reports.html" class="px-3 py-2 rounded-lg bg-white/10 font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2" aria-current="page">Reports</a>
        <a href="goals.html" class="px-3 py-2 rounded-lg hover:bg-white/10 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2">Goals</a>
      </nav>
    </aside>

    <div id="sidebarBackdrop" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

    <div class="flex-1 flex flex-col">

      <header class="flex items-center gap-4 px-6 lg:px-10 py-6 border-b border-black/5">
        <button id="sidebarToggle" class="p-2 rounded-lg hover:bg-black/5 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2" aria-label="Toggle sidebar">
          <span class="block w-5 h-0.5 bg-primary mb-1"></span>
          <span class="block w-5 h-0.5 bg-primary mb-1"></span>
          <span class="block w-5 h-0.5 bg-primary"></span>
        </button>
        <div>
          <h1 class="text-2xl font-bold text-primary">Emissions Reports</h1>
          <p class="text-sm text-muted">Detailed history and breakdowns</p>
        </div>
      </header>

      <main class="flex-1 px-6 lg:px-10 py-8 space-y-8">

        <section aria-label="Reports charts" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 bg-card rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow duration-200">
            <h2 class="font-semibold text-primary mb-4">12-Month Emissions Trend</h2>
            <div class="h-64">
              <canvas id="yearlyTrendChart" role="img" aria-label="Line chart showing 12 months of emissions trend"></canvas>
            </div>
          </div>
          <div class="bg-card rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow duration-200">
            <h2 class="font-semibold text-primary mb-4">By Category</h2>
            <div class="h-64">
              <canvas id="reportsCategoryChart" role="img" aria-label="Donut chart showing emissions breakdown by category"></canvas>
            </div>
          </div>
        </section>

        <section aria-label="Monthly emissions history" class="bg-card rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow duration-200">
          <h2 class="font-semibold text-primary mb-4">Monthly History</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
              <thead>
                <tr class="border-b border-black/10 text-muted">
                  <th class="py-2 pr-4 font-medium">Month</th>
                  <th class="py-2 pr-4 font-medium">Total (kg CO₂e)</th>
                  <th class="py-2 pr-4 font-medium">Change</th>
                </tr>
              </thead>
              <tbody id="reportsTableBody">
              </tbody>
            </table>
          </div>
        </section>

      </main>

      <footer class="px-6 lg:px-10 py-6 text-center text-xs text-muted border-t border-black/5">
        © 2026 EcoTrack Dashboard: Built for a greener tomorrow.
      </footer>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>

  <script src="js/data.js" defer></script>
  <script src="js/reports.js" defer></script>
  <script src="js/sidebar.js" defer></script>
</body>
</html>
